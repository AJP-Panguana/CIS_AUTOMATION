# Shared settings for every environment.
# Any key can be overridden with -Dkey=value or env var CIS_KEY (dots -> underscores).
# Environment: -Denv=qa|uat|prod (default: qa)

# chrome | firefox | edge
browser=chrome
headless=false

# Seconds to wait for elements / page loads
timeout.seconds=10
page.load.timeout.seconds=60

# true = leave the browser open after each test (debugging only)
keep.browser.open=false

# Selenium Grid. Empty = run browsers on this machine.
# With docker-compose up: grid.url=http://localhost:4444
grid.url=
